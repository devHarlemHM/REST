services:
  app:
    build:
      context: ./app
      args:
        API_ENV: ${APP_ENV:?APP_ENV is required}
        API_BASE_URL: ${API_URL:?API_URL is required}
    restart: unless-stopped
    expose: ["80"]
    networks:
      edge:
        aliases: ["${APP_NETWORK_ALIAS:?APP_NETWORK_ALIAS is required}"]

  admin:
    build:
      context: ./admin
      args:
        VITE_API_ENV: ${APP_ENV:?APP_ENV is required}
        VITE_API_URL: ${API_URL:?API_URL is required}
    restart: unless-stopped
    expose: ["80"]
    networks:
      edge:
        aliases: ["${ADMIN_NETWORK_ALIAS:?ADMIN_NETWORK_ALIAS is required}"]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV is required}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:1.5b}
      USE_OLLAMA: ${USE_OLLAMA:-true}
      SENTIMENT_API_URL: http://sentiment:8000
      SEED_ON_START: ${SEED_ON_START:-false}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      sentiment: { condition: service_healthy }
      ollama: { condition: service_healthy }
      ollama-init: { condition: service_completed_successfully }
    networks:
      edge:
        aliases: ["${BACKEND_NETWORK_ALIAS:?BACKEND_NETWORK_ALIAS is required}"]
      internal: {}

  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes: ["ollama_data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [internal]

  ollama-init:
    image: curlimages/curl:latest
    restart: "no"
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:1.5b}
    depends_on:
      ollama: { condition: service_healthy }
    command: ["sh", "-c", "curl -fsS http://ollama:11434/api/tags | grep -q \"$${OLLAMA_MODEL}\" || curl -fsS http://ollama:11434/api/pull -H 'Content-Type: application/json' -d \"{\\\"name\\\":\\\"$${OLLAMA_MODEL}\\\"}\""]
    networks: [internal]

  sentiment:
    build:
      context: ./backend/sentiment
    restart: unless-stopped
    environment:
      TRANSFORMERS_CACHE: /root/.cache/huggingface
    volumes: ["hf_cache:/root/.cache/huggingface"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [internal]

networks:
  edge:
    external: true
    name: rest-edge
  internal:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  hf_cache:
